<title>Noticias</title>
<style>
:root {
  --fondo: #f4f3ef; --tarjeta: #ffffff; --texto: #1b1c1f; --suave: #6b6d73;
  --linea: #e3e1da; --acento: #b4532a; --chip: #ebe9e2; --chip-on: #1b1c1f; --chip-on-t: #fff;
  --nuevo: #b4532a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #14161a; --tarjeta: #1d2025; --texto: #e8e6e1; --suave: #9a9ca3;
    --linea: #2c3036; --acento: #e08a5c; --chip: #262a30; --chip-on: #e8e6e1; --chip-on-t: #14161a;
    --nuevo: #e08a5c;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--fondo);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; border-bottom: 1px solid var(--linea); }
.fila { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 1.25rem; margin: 0; letter-spacing: -.01em; }
#actualizado { color: var(--suave); font-size: .78rem; }
nav { display: flex; gap: 4px; margin: 10px 0 8px; }
nav button { flex: 1; border: 0; background: var(--chip); color: var(--texto); padding: 8px 0;
  border-radius: 8px; font: inherit; font-size: .9rem; }
nav button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-t); font-weight: 600; }
#chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
#chips::-webkit-scrollbar { display: none; }
#chips button { flex: none; border: 1px solid var(--linea); background: transparent; color: var(--texto);
  border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .82rem; }
#chips button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: #fff; }
#buscar { width: 100%; margin-top: 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--linea);
  background: var(--tarjeta); color: var(--texto); font: inherit; font-size: .95rem; }
main { padding: 12px 16px calc(env(safe-area-inset-bottom) + 40px); max-width: 760px; margin: 0 auto; }
.tema, .noticia-suelta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px;
  margin-bottom: 10px; overflow: hidden; }
.tema > summary { list-style: none; padding: 12px 14px; cursor: pointer; }
.tema > summary::-webkit-details-marker { display: none; }
.tema h2 { font-size: 1.02rem; margin: 0 0 6px; line-height: 1.3; }
.meta { color: var(--suave); font-size: .78rem; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.bloque { color: var(--acento); font-weight: 600; }
.lista { border-top: 1px solid var(--linea); }
.n { display: block; padding: 10px 14px; color: inherit; text-decoration: none; border-top: 1px solid var(--linea); }
.lista > .desliza:first-child .n { border-top: 0; }
.n .t { font-size: .95rem; }
.n .r { color: var(--suave); font-size: .85rem; margin-top: 4px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.n .o { color: var(--suave); font-size: .75rem; font-style: italic; margin-top: 4px; }
.leida { opacity: .5; }
.punto { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--nuevo);
  margin-right: 6px; vertical-align: middle; }
.vacio { color: var(--suave); text-align: center; padding: 40px 0; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; background: var(--tarjeta);
  border-radius: 12px; overflow: hidden; }
td { padding: 8px 10px; border-bottom: 1px solid var(--linea); }
td.num { text-align: right; color: var(--suave); }
.mal { color: #c0392b; }
td a { color: inherit; }
tr.inactiva td { color: var(--suave); }
a.mas { text-align: center; text-decoration: none; margin: 0 0 10px; }
.editor { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 14px; margin-bottom: 4px; }
.editor summary { cursor: pointer; font-weight: 600; }
.editor label { display: block; font-size: .85rem; color: var(--suave); margin-top: 10px; }
.editor input:not([type="checkbox"]), .editor select { display: block; width: 100%; margin-top: 4px; padding: 8px 10px;
  border-radius: 8px; border: 1px solid var(--linea); background: var(--fondo); color: var(--texto); font: inherit; font-size: .95rem; }
.editor input[type="checkbox"] { margin-left: 8px; }
.yaml { background: var(--fondo); border-radius: 8px; padding: 10px; font-size: .78rem; overflow-x: auto; white-space: pre; }
/* deslizar: derecha oculta, izquierda archiva */
.desliza { position: relative; overflow: hidden; transition: height .2s, margin .2s; }
main > .desliza { margin-bottom: 10px; border-radius: 12px; }
.desliza > .tema, .desliza > .noticia-suelta { margin: 0; }
.desliza.cierra { margin-bottom: 0; }
.mueve { position: relative; background: var(--tarjeta); transition: transform .18s; touch-action: pan-y; }
.arrastra .mueve { transition: none; -webkit-user-select: none; user-select: none; }
.fondo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; color: #fff; font-weight: 600; font-size: .9rem; }
.desliza[data-dir="der"] .fondo { background: var(--suave); }
.desliza[data-dir="izq"] .fondo { background: var(--acento); }
.desliza[data-dir="der"] .l-izq, .desliza[data-dir="izq"] .l-der, .desliza:not([data-dir]) .fondo span { visibility: hidden; }
#aviso { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%);
  z-index: 10; display: none; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 10px;
  background: var(--chip-on); color: var(--chip-on-t); font-size: .9rem; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
#aviso.ver { display: flex; }
#aviso button { border: 0; background: none; color: var(--acento); font: inherit; font-weight: 700; padding: 0; }
.mas { display: block; width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--linea);
  background: transparent; color: var(--texto); border-radius: 10px; font: inherit; }
</style>
</head>

  <div class="fila"><h1>Noticias</h1><span id="actualizado"></span></div>

</header>

Crunch Startups","linea":833,"bloque":"Emprendimiento","activa":true,"estado":"ok","n":2},{"nombre":"Trends.vc (ideas de negocio)","linea":838,"bloque":"Emprendimiento","activa":true,"estado":"ok","n":4},{"nombre":"Not Boring","linea":844,"bloque":"Emprendimiento","activa":true,"estado":"ok","n":2},{"nombre":"Lenny's Newsletter","linea":850,"bloque":"Emprendimiento","activa":true,"estado":"ok","n":5},{"nombre":"Product Hunt (productos nuevos)","linea":856,"bloque":"Emprendimiento","activa":true,"estado":"ok","n":15},{"nombre":"Show HN (proyectos nuevos)","linea":861,"bloque":"Emprendimiento","activa":true,"estado":"ok","n":3},{"nombre":"Marketing4ecommerce","linea":867,"bloque":"Emprendimiento","activa":false,"estado":"desactivada","n":0},{"nombre":"Catawiki y Wallapop (novedades)","linea":873,"bloque":"Emprendimiento","activa":true,"estado":"ok","n":14}],"repo":"silversun-dev/new"}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("datos").textContent);
  const $ = (s) => document.querySelector(s);
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } };

  let vista = leer("vista", "temas");
  let bloquesOn = new Set(leer("bloques", []));
  let texto = "";
  let limite = 60;
  const leidas = new Set(leer("leidas", []));
  // ocultas: deslizadas a la derecha; archivo: deslizadas a la izquierda (se guarda
  // la noticia entera porque desaparece de los datos pasados unos días)
  let ocultas = new Set(leer("ocultas", []));
  let archivo = leer("archivo", []);
  let archivadas = new Set(archivo.map((n) => n.i));
  // sesión: guarda la visita anterior para que los puntos de "nuevo" no
  // desaparezcan al volver de leer una noticia
  const ses = { get: (k) => { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } },
                set: (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  let ultimaVisita = ses.get("ultimaVisita");
  if (ultimaVisita == null) { ultimaVisita = leer("ultimaVisita", 0); ses.set("ultimaVisita", ultimaVisita); }
  guardar("ultimaVisita", D.generado);

  // estado para volver al mismo punto tras leer una noticia
  const volver = ses.get("volver"); ses.set("volver", null);
  const abiertos = new Set(volver ? volver.abiertos : []);
  if (volver) { limite = volver.limite; texto = volver.texto || ""; }

  const hace = (ts) => {
    const m = Math.round((Date.now() / 1000 - ts) / 60);
    if (m < 60) return `hace ${Math.max(m, 1)} min`;
    const h = Math.round(m / 60);
    return h < 48 ? `hace ${h} h` : `hace ${Math.round(h / 24)} d`;
  };
  const el = (tag, cls, txt) => { const e = document.createElement(tag);
    if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  $("#actualizado").textContent = "actualizado " + hace(D.generado);

  // chips de bloques
  const bloques = [...new Set(D.temas.flatMap((g) => g.n.map((n) => n.b)))].sort();
  for (const b of bloques) {
    const c = el("button", null, b);
    c.setAttribute("aria-pressed", bloquesOn.has(b));
    c.onclick = () => { bloquesOn.has(b) ? bloquesOn.delete(b) : bloquesOn.add(b);
      c.setAttribute("aria-pressed", bloquesOn.has(b)); guardar("bloques", [...bloquesOn]); limite = 60; pintar(); };
    $("#chips").append(c);
  }

  document.querySelectorAll("nav button").forEach((b) => {
    b.onclick = () => { vista = b.dataset.vista; guardar("vista", vista); limite = 60; abiertos.clear(); pintar(); window.scrollTo(0, 0); };
  });
  $("#buscar").oninput = (e) => { texto = e.target.value.trim().toLowerCase(); limite = 60; pintar(); };

  const coincide = (n) => (!bloquesOn.size || bloquesOn.has(n.b)) &&
    (!texto || (n.t + " " + (n.r || "") + " " + (n.o || "") + " " + n.m).toLowerCase().includes(texto));
  const visible = (n) => !ocultas.has(n.i) && !archivadas.has(n.i);
  const pasaFiltro = (n) => visible(n) && coincide(n);

  function guardarEstado() {
    archivo = archivo.slice(0, 1000);
    archivadas = new Set(archivo.map((n) => n.i));
    guardar("ocultas", [...ocultas].slice(-5000)); guardar("archivo", archivo);
  }
  let tAviso;
  // cambia el estado y ofrece deshacerlo durante unos segundos
  function cambiar(msg, fn) {
    const antes = { o: [...ocultas], a: [...archivo] };
    fn(); guardarEstado();
    const av = $("#aviso");
    av.firstChild.textContent = msg; av.classList.add("ver");
    clearTimeout(tAviso); tAviso = setTimeout(() => av.classList.remove("ver"), 5000);
    av.lastChild.onclick = () => {
      ocultas = new Set(antes.o); archivo = antes.a; guardarEstado();
      clearTimeout(tAviso); av.classList.remove("ver"); pintar();
    };
  }
  const archivar = (n) => archivo.unshift({ ...n, a: Math.floor(Date.now() / 1000) });

  // envuelve un elemento para poder deslizarlo; acciones = { der, izq }: { texto, hacer }
  function deslizable(hijo, acciones) {
    const w = el("div", "desliza");
    const fondo = el("div", "fondo");
    fondo.append(el("span", "l-der", acciones.der ? acciones.der.texto : ""),
                 el("span", "l-izq", acciones.izq ? acciones.izq.texto : ""));
    hijo.classList.add("mueve");
    w.append(fondo, hijo);
    let x0, y0, dx = 0, modo = null, id = null, arrastrado = false;
    hijo.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();   // una noticia dentro de un tema no arrastra el tema
      x0 = e.clientX; y0 = e.clientY; dx = 0; modo = null; id = e.pointerId; arrastrado = false;
    });
    hijo.addEventListener("pointermove", (e) => {
      if (id !== e.pointerId) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!modo) {
        if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.5) {
          modo = "h"; arrastrado = true; w.classList.add("arrastra");
          try { hijo.setPointerCapture(id); } catch (err) {}
        } else if (Math.abs(my) > 10) modo = "v";
      }
      if (modo !== "h") return;
      const sinAccion = mx > 0 ? !acciones.der : !acciones.izq;
      dx = sinAccion ? mx / 5 : mx;   // hacia un lado sin acción solo cede un poco
      hijo.style.transform = `translateX(${dx}px)`;
      w.dataset.dir = dx > 0 ? "der" : "izq";
    });
    const fin = (e) => {
      if (id !== e.pointerId) return;
      id = null; w.classList.remove("arrastra");
      if (modo !== "h") return;
      const umbral = Math.min(110, w.offsetWidth * 0.3);
      const acc = dx > umbral ? acciones.der : dx < -umbral ? acciones.izq : null;
      if (!acc) { hijo.style.transform = ""; return; }
      hijo.style.transform = `translateX(${dx > 0 ? 110 : -110}%)`;
      setTimeout(() => {
        w.style.height = w.offsetHeight + "px";
        requestAnimationFrame(() => { w.classList.add("cierra"); w.style.height = "0"; });
        setTimeout(() => { w.remove(); acc.hacer(); }, 200);
      }, 180);
    };
    hijo.addEventListener("pointerup", fin);
    hijo.addEventListener("pointercancel", fin);
    // al soltar tras arrastrar no se abre el enlace ni se despliega el tema
    hijo.addEventListener("click", (e) => {
      if (arrastrado) { e.preventDefault(); e.stopPropagation(); arrastrado = false; }
    }, true);
    return w;
  }

  const accionesNoticia = (n) => ({
    der: { texto: "Ocultar", hacer: () => cambiar("Noticia ocultada", () => ocultas.add(n.i)) },
    izq: { texto: "Archivar", hacer: () => cambiar("Noticia archivada", () => archivar(n)) },
  });

  function noticia(n) {
    const a = el("a", "n" + (leidas.has(n.i) ? " leida" : ""));
    a.href = n.u; a.rel = "noreferrer"; a.draggable = false;   // se abre en la misma pestaña; "atrás" vuelve aquí
    const t = el("div", "t");
    if (n.ts > ultimaVisita && !leidas.has(n.i)) t.append(el("span", "punto"));
    t.append(n.t); a.append(t);
    if (n.r) a.append(el("div", "r", n.r));
    if (n.o) a.append(el("div", "o", n.o));
    const m = el("div", "meta");
    m.append(el("span", "bloque", n.m), el("span", null, hace(n.ts)));
    a.append(m);
    a.onclick = () => {
      leidas.add(n.i); guardar("leidas", [...leidas].slice(-3000)); a.classList.add("leida");
      ses.set("volver", { y: window.scrollY, abiertos: [...abiertos], limite, texto });
    };
    return a;
  }

  function botonMas(total) {
    if (total <= limite) return null;
    const b = el("button", "mas", `Ver más (${total - limite})`);
    b.onclick = () => { limite += 60; pintar(); };
    return b;
  }

  function pintarTemas(c) {
    const temas = D.temas
      .map((g) => ({ ...g, n: g.n.filter(visible) }))
      .map((g) => ({ ...g, v: g.n.filter(coincide) }))
      // sin filtro: solo temas que cubren 2+ medios; con un bloque elegido, todo lo de ese bloque
      .filter((g) => g.v.length && (bloquesOn.size || new Set(g.n.map((n) => n.m)).size >= 2));
    if (!temas.length) return c.append(el("p", "vacio", "Nada coincide con el filtro."));
    for (const g of temas.slice(0, limite)) {
      const d = el("details", "tema");
      const s = el("summary");
      const h = el("h2");
      if (g.ts > ultimaVisita && !g.n.every((n) => leidas.has(n.i))) h.append(el("span", "punto"));
      h.append(g.t);
      const medios = [...new Set(g.n.map((n) => n.m))];
      const m = el("div", "meta");
      m.append(el("span", "bloque", g.b.join(" · ")),
               el("span", null, `${medios.length} medios`), el("span", null, hace(g.ts)));
      s.append(h, m); d.append(s);
      const lista = el("div", "lista");
      const clave = g.n[0].i;
      const rellenar = () => { if (!lista.childElementCount)
        g.n.forEach((n) => lista.append(deslizable(noticia(n), accionesNoticia(n)))); };
      d.addEventListener("toggle", () => {
        if (d.open) { rellenar(); abiertos.add(clave); } else abiertos.delete(clave);
      });
      d.append(lista);
      if (abiertos.has(clave)) { rellenar(); d.open = true; }
      // el tema entero: ocultar oculta todas sus noticias; archivar guarda la principal
      c.append(deslizable(d, {
        der: { texto: "Ocultar tema", hacer: () => cambiar("Tema ocultado", () => g.n.forEach((n) => ocultas.add(n.i))) },
        izq: { texto: "Archivar", hacer: () => cambiar("Tema archivado", () => {
          archivar({ ...g.n[0], t: g.t }); g.n.forEach((n) => ocultas.add(n.i)); }) },
      }));
    }
    const mas = botonMas(temas.length); if (mas) c.append(mas);
  }

  function pintarTodo(c) {
    const todas = D.temas.flatMap((g) => g.n).filter(pasaFiltro).sort((a, b) => b.ts - a.ts);
    if (!todas.length) return c.append(el("p", "vacio", "Nada coincide con el filtro."));
    for (const n of todas.slice(0, limite)) {
      const w = el("div", "noticia-suelta"); w.append(noticia(n)); c.append(deslizable(w, accionesNoticia(n)));
    }
    const mas = botonMas(todas.length); if (mas) c.append(mas);
  }

  function pintarArchivo(c) {
    const lista = archivo.filter(coincide);
    if (!archivo.length) return c.append(el("p", "vacio",
      "No hay noticias archivadas. Desliza una noticia a la izquierda para guardarla aquí; a la derecha la ocultas."));
    if (!lista.length) return c.append(el("p", "vacio", "Nada coincide con el filtro."));
    for (const n of lista.slice(0, limite)) {
      const w = el("div", "noticia-suelta"); w.append(noticia(n));
      c.append(deslizable(w, { der: { texto: "Quitar del archivo", hacer: () => cambiar("Quitada del archivo",
        () => { archivo = archivo.filter((x) => x.i !== n.i); }) } }));
    }
    const mas = botonMas(lista.length); if (mas) c.append(mas);
  }

  // las fuentes se editan en GitHub (fuentes.yaml); al guardar, la web se regenera sola
  const repo = D.repo || "silversun-dev/new";
  const urlEditar = `https://github.com/${repo}/edit/main/fuentes.yaml`;
  const urlLinea = (n) => `https://github.com/${repo}/blob/main/fuentes.yaml#L${n}`;

  function formularioFuente() {
    const f = el("details", "editor");
    f.append(el("summary", null, "＋ Añadir una fuente"));
    const campo = (etiqueta, input) => { const l = el("label", null, etiqueta); l.append(input); f.append(l); return input; };
    const nombre = campo("Nombre", Object.assign(el("input"), { placeholder: "Cómo aparece en la web" }));
    const url = campo("RSS o web", Object.assign(el("input"), { placeholder: "https://… (feed) o dominio.com" }));
    const sinRss = campo("No tiene RSS: leerla por Google News", Object.assign(el("input"), { type: "checkbox" }));
    const bloque = campo("Bloque", Object.assign(el("input"), { placeholder: "Elige o escribe uno nuevo" }));
    const lista = el("datalist"); lista.id = "bloques-lista"; bloque.setAttribute("list", lista.id);
    [...new Set(D.fuentes.map((x) => x.bloque).filter(Boolean))].sort()
      .forEach((b) => lista.append(Object.assign(el("option"), { value: b })));
    f.append(lista);
    const idioma = campo("Idioma", el("select"));
    [["es", "Español"], ["en", "Inglés"], ["fr", "Francés"], ["de", "Alemán"], ["it", "Italiano"], ["pt", "Portugués"], ["ja", "Japonés"]]
      .forEach(([v, t]) => idioma.append(Object.assign(el("option", null, t), { value: v })));
    const dias = campo("Días a mostrar (vacío = 48 h; pon 7–30 si publica poco)", Object.assign(el("input"), { type: "number", min: 1 }));
    const salida = el("pre", "yaml");
    const boton = el("button", "mas", "Copiar y abrir fuentes.yaml en GitHub");
    const aviso = el("p", "vacio", "Pega el bloque en la sección que quieras (o al final) y pulsa «Commit changes». La web se actualiza sola en unos minutos.");
    const yaml = () => {
      let u = url.value.trim();
      if (sinRss.checked) {
        const dominio = u.replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "");
        const [hl, gl, ceid] = idioma.value === "es" ? ["es", "ES", "ES:es"] : ["en-US", "US", "US:en"];
        u = `https://news.google.com/rss/search?q=site:${dominio}+when:${dias.value || 2}d&hl=${hl}&gl=${gl}&ceid=${ceid}`;
      }
      // un ":" o "#" en el texto rompería el YAML: entre comillas
      const q = (t) => /[:#]/.test(t) ? JSON.stringify(t) : t;
      return `  - nombre: ${q(nombre.value.trim() || "Nueva fuente")}\n    url: ${u}\n    bloque: ${q(bloque.value.trim() || "Otros")}\n` +
        `    idioma: ${idioma.value}\n    activa: true\n` + (dias.value ? `    dias: ${dias.value}\n` : "");
    };
    f.addEventListener("input", () => { salida.textContent = yaml(); });
    salida.textContent = yaml();
    boton.onclick = async () => {
      try { await navigator.clipboard.writeText(yaml()); boton.textContent = "Copiado ✓ Abriendo GitHub…"; } catch (e) {}
      window.open(urlEditar, "_blank", "noopener");
    };
    f.append(salida, boton, aviso);
    return f;
  }

  function pintarFuentes(c) {
    const editar = Object.assign(el("a", "mas", "✎ Editar fuentes.yaml en GitHub"), { href: urlEditar, target: "_blank", rel: "noopener" });
    c.append(editar, formularioFuente());
    c.append(el("p", "vacio", "Toca una fuente para verla en el archivo; para cambiarla, pulsa el lápiz de GitHub. Para desactivarla, cambia «activa: true» por «activa: false»."));
    const t = el("table");
    for (const f of D.fuentes) {
      const tr = el("tr", f.activa === false ? "inactiva" : null);
      const nombre = el("td");
      nombre.append(f.linea ? Object.assign(el("a", null, f.nombre), { href: urlLinea(f.linea), target: "_blank", rel: "noopener" }) : f.nombre);
      tr.append(nombre, el("td", null, f.bloque),
                el("td", "num", String(f.n)), el("td", ["ok", "desactivada"].includes(f.estado) ? "num" : "num mal", f.estado));
      t.append(tr);
    }
    c.append(t);
  }

  function pintar() {
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.vista === vista));
    $("#chips").style.display = $("#buscar").style.display = vista === "fuentes" ? "none" : "";
    const c = $("#contenido"); c.replaceChildren();
    ({ temas: pintarTemas, todo: pintarTodo, archivo: pintarArchivo, fuentes: pintarFuentes })[vista](c);
  }
  $("#buscar").value = texto;
  pintar();
  if (volver) {
    // el navegador suele subir al principio al cargar; recolocamos tras la carga
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    const ir = () => window.scrollTo(0, volver.y);
    ir(); requestAnimationFrame(ir); window.addEventListener("load", () => setTimeout(ir, 0));
  }
  // si el navegador restaura la página de su caché al pulsar "atrás", ya está todo en su sitio
})();
</script>
